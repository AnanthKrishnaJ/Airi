return`<h1>Quizzes</h1><p class=mut>Practice quizzes show the answer and the marks right after each question.</p><div class=grid><div class=card><b>Quick Practice</b><p class=mut>10 random questions with instant feedback.</p><button class=pri onclick="startQuick()">Start</button></div><div class=card><b>Mixed Quiz</b><p class=mut>25 questions, answers revealed at the end.</p><button class=pri onclick="startMixed()">Start</button></div></div><h2>Difficulty practice</h2><div class=grid style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${DIFF.map(d=>`<button class="card tc dc" style="--c:${dc[d]}" onclick="startDiff('${d}')"><b>${d}</b><span class=mut>20 questions</span></button>`).join('')}</div><h2>Data Interpretation</h2><div class=grid>${DI.map(([i,ic,d])=>`<button class="card tc" onclick="startTopic(${i},20)"><span class=ci>${I(ic)}</span><b>${T[i]}</b><span class=mut>${d} · 20 questions</span></button>`).join('')}</div>`}
function papers(){const multi=PYQ.filter(question=>question.multi).length;return`<h1>Previous year question paper</h1><p class=mut>Attempt the supplied Innovature assessment under timed conditions. Select every correct option on multi-answer questions; answers and explanations appear after submission.</p><div class=grid><section class="card paper-card"><span class=paper-kicker>PAST PAPER · INNOVATURE</span><h2>Technical, aptitude &amp; logical reasoning</h2><p class=mut>${PYQ.length} questions · 60 minutes · +1 correct · −1 incorrect · 0 unanswered</p><div class=paper-topics><span>Technical · 40</span><span>Aptitude &amp; reasoning · 10</span><span>${multi} multi-answer</span></div><button class=pri onclick="startPaper()">${I('play')} Start paper</button></section></div><h2>Sections</h2><div class=grid><div class=card><b>Technical</b><p class=mut>Programming, databases, networking, operating systems, cloud, security, markup, and software testing.</p></div><div class=card><b>Aptitude &amp; logical reasoning</b><p class=mut>Clock, age, partnership, speed, time, series, and cryptarithmetic problems.</p></div></div>`}
function paperQuestionReview(question,index,expanded=false){const correct=correctAnswerText(question);return`<details class="paper-explanation" ${expanded?'open':''}><summary><span class=paper-qno>${String(index+1).padStart(2,'0')}</span><span class=paper-question>${question.question}</span><span class=paper-open>Answer + logic</span></summary>${question.ctx?`<div class=ctx>${question.ctx}</div>`:''}<div class=paper-options>${question.options.map((option,i)=>`<span class="${answerIndexes(question).includes(i)?'paper-correct':''}"><b>${'ABCD'[i]}</b>${option}</span>`).join('')}</div><div class=paper-reason><b>Correct answer${answerIndexes(question).length>1?'s':''}: ${correct}</b><p><strong>Why:</strong> ${question.explanation}</p><small>${question.topic} · ${question.difficulty}${question.multi?' · Select all that apply':''}</small></div></details>`}
function openPaperStudy(){showPaperStudy=true;view='papers';draw();scrollTo(0,0)}
function closePaperStudy(){showPaperStudy=false;view='papers';draw();scrollTo(0,0)}
function papers(){const multi=PYQ.filter(question=>question.multi).length;if(showPaperStudy)return`<button class=gh onclick="closePaperStudy()">${I('l')} Back to paper</button><h1>Answer logic</h1><p class=mut>Correct answers are highlighted. Each explanation walks through the reason for the key.</p><div class=paper-review>${PYQ.map((question,index)=>paperQuestionReview(question,index,true)).join('')}</div>`;return`<h1>Previous year question paper</h1><p class=mut>Attempt the supplied Innovature assessment under timed conditions. Multi-answer questions require selecting every correct option.</p><div class=grid><section class="card paper-card"><span class=paper-kicker>PAST PAPER · INNOVATURE</span><h2>Technical, aptitude &amp; logical reasoning</h2><p class=mut>${PYQ.length} questions · 60 minutes · +1 correct · −1 incorrect · 0 unanswered</p><div class=paper-topics><span>Technical · 40</span><span>Aptitude &amp; reasoning · 10</span><span>${multi} multi-answer</span></div><div class=paper-actions><button class=pri onclick="startPaper()">${I('play')} Start timed paper</button><button class="bk o" onclick="openPaperStudy()">Study answers &amp; logic</button></div></section></div>`}
function mock(){return`<h1>Full Mock Test</h1><div class=card><p class=mut>Questions from the whole syllabus. Correct +1, wrong −1, unanswered 0. Answers are revealed only after submission; the test submits itself when time ends.</p><div class=row><label>Questions <select id=mn><option>50</option><option>100</option></select></label><label>Time <select id=mt><option value=30>30 minutes</option><option value=60>60 minutes</option><option value=90>90 minutes</option></select></label><button class=pri onclick="startMock()">Start test</button></div></div>`}
function begin(o){S={...o,a:Array(o.qs.length).fill(null),mk:Array(o.qs.length).fill(false),checked:Array(o.qs.length).fill(false),c:0,t0:Date.now(),end:o.secs?Date.now()+o.secs*1000:0,warned:false,anim:1,dir:1};clearInterval(tm);tm=setInterval(tick,500);draw()}
const startTopic=(i,n)=>{let q=bank(i);if(filt.d&&n==null)q=q.filter(x=>x.difficulty==filt.d);const m=n||filt.n;begin({title:T[i],qs:i>34?q.slice(0,m):sample(q,m),inst:true})};
const startQuick=()=>begin({title:'Quick Practice',qs:sample(all(),10),inst:true}),startMixed=()=>begin({title:'Mixed Quiz',qs:sample(all(),25),inst:false}),startDiff=d=>begin({title:d+' Practice',qs:sample(all().filter(x=>x.difficulty==d),20),inst:true}),startMock=()=>begin({title:'Full Mock Test',qs:sample(all(),+$('#mn').value),secs:+$('#mt').value*60,mock:true}),startPaper=()=>begin({title:'Previous year question paper · Innovature',qs:PYQ,secs:60*60,mock:true,paper:true,inst:true});
function tick(){if(!S)return;let r=S.end?S.end-Date.now():Date.now()-S.t0;if(S.end&&r<=0){submit(true);return}
if(S.end&&r<=3e5&&!S.warned){S.warned=true;draw();return}const s=Math.floor(r/1e3),el=$('#tm'),rg=$('#tr'),w=$('#tw');if(!el)return;
el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
if(S.end){const f=r/(S.secs*1000);rg.style.strokeDashoffset=119.4*(1-f);w.className='tmw'+(r<=3e5?' low':f<.25?' mid':'')}else rg.style.strokeDashoffset=119.4*(1-(s%60)/60);
el.className='tk'+(s%2)}
function answerIndexes(question){return question.correctAnswers||[question.correctAnswer]}
function isCorrectResponse(question,response){if(response==null)return false;const expected=answerIndexes(question),actual=Array.isArray(response)?response:[response];return actual.length===expected.length&&expected.every(index=>actual.includes(index))}
function answerText(question,response){if(response==null)return'Unanswered';const indexes=Array.isArray(response)?response:[response];return indexes.map(index=>`${'ABCD'[index]}. ${question.options[index]}`).join('; ')}
function correctAnswerText(question){return answerText(question,answerIndexes(question))}
function quiz(){const q=S.qs[S.c],a=S.a[S.c],reveal=S.inst&&a!=null&&(!q.multi||S.checked[S.c]),n=S.qs.length,an=S.anim,dd=S.dir>0?'r':'l',dn=S.a.filter(x=>x!=null).length,sc=S.a.reduce((t,x,i)=>x==null||(S.qs[i].multi&&!S.checked[i])?t:t+(isCorrectResponse(S.qs[i],x)?1:-1),0);S.anim=0;
return`<div class="card top"><button class=gh onclick="quitQ()" aria-label="Quit quiz">${I('x')}<span class=hm> Quit</span></button><div class=tl><b>${S.title}</b><span class=mut>${q.topic}<em class="chip ${q.difficulty}">${q.difficulty}</em></span></div><div class=tmw id=tw><svg viewBox="0 0 44 44"><circle class=tb cx=22 cy=22 r=19></circle><circle class=tf id=tr cx=22 cy=22 r=19></circle></svg><span id=tm></span></div><button class=pri onclick="submit(false)">Submit</button></div><div class=qi><span>Question <b>${S.c+1}</b> of ${n}</span><span class=mut>${dn} answered</span>${S.inst?`<span class="sc ${sc<0?'neg':''}">Score ${sc>0?'+':sc<0?'−':''}${Math.abs(sc)}</span>`:''}</div><div class=prog><i style="width:${dn/n*100}%"></i></div>${S.warned?`<div class=warn>${I('clock')} Only 5 minutes remain.</div>`:''}<div class=qw><div><div class="card qc ${an?'sl'+dd:''}">${q.ctx?`<div class=ctx>${q.ctx}</div>`:''}<p class=qt>${q.question}</p>${q.multi?'<p class=mut>Select all that apply, then check your answer.</p>':''}${q.options.map((o,j)=>{const selected=q.multi?Array.isArray(a)&&a.includes(j):a===j,correctOption=answerIndexes(q).includes(j);return`<button class="opt ${an?'st':''} ${reveal&&correctOption?'ok':reveal&&selected?'bad':selected?'sel':''}" style="--i:${j}" ${reveal?'disabled':''} onclick="pickA(${j})"><b class=lt>${'ABCD'[j]}</b><span>${o}</span></button>`}).join('')}${reveal?`<div class=exp><b style="color:var(--${isCorrectResponse(q,a)?'ok':'bad'})">${isCorrectResponse(q,a)?I('check')+' Correct · +1 mark':I('x')+' Incorrect · −1 mark'}</b>${isCorrectResponse(q,a)?'':'Correct answer: '+correctAnswerText(q)+'. '}${q.explanation}</div>`:''}</div><div class=acts><button onclick="nav(-1)" ${S.c?'':'disabled'}>${I('l')} Prev</button>${!S.inst||q.multi?`<button onclick="clr()" ${a==null?'disabled':''}>Clear</button>`:''}${S.inst&&q.multi&&!reveal&&a!=null?`<button class=pri onclick="checkAnswer()">${I('check')} Check answer</button>`:''}<button onclick="S.mk[S.c]=!S.mk[S.c];draw()">${S.mk[S.c]?I('starf')+' Marked':I('star')+' Review'}</button><button class=pri onclick="nav(1)" ${S.c<n-1?'':'disabled'}>Next ${I('r')}</button></div></div>
<details class="card pl" ${innerWidth>800?'open':''}><summary>Question palette · ${dn}/${n} answered</summary><div class=pal>${S.qs.map((_,i)=>`<button class="${S.a[i]!=null?'ans':''} ${S.mk[i]?'mk':''} ${i==S.c?'cur':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class=lg><span style="background:var(--ok)"></span>Answered<span></span>Unanswered<span style="box-shadow:inset 0 0 0 3px var(--wa)"></span>Marked</div></details></div>`}
const quitQ=()=>ask('Leave this quiz? Your answers will not be saved.','Leave quiz',()=>go('home'));
const pickA=j=>{const q=S.qs[S.c];if(S.inst&&S.a[S.c]!=null&&(!q.multi||S.checked[S.c]))return;if(q.multi){const current=Array.isArray(S.a[S.c])?S.a[S.c]:[];const next=current.includes(j)?current.filter(index=>index!==j):[...current,j];S.a[S.c]=next.length?next:null}else S.a[S.c]=j;draw()},checkAnswer=()=>{if(S&&S.qs[S.c].multi&&S.a[S.c]!=null){S.checked[S.c]=true;draw()}},clr=()=>{S.a[S.c]=null;draw()},jump=i=>{S.dir=i>S.c?1:-1;S.c=i;S.anim=1;draw();scrollTo({top:0,behavior:'smooth'})},nav=d=>jump(S.c+d);
let MO=null,MF=null;
function ask(msg,yes,fn){mclose(0);MF=fn;MO=document.createElement('div');MO.className='mo';MO.innerHTML=`<div class=mb role=dialog aria-modal=true><p>${msg}</p><div class=row><button onclick="mclose(0)">Cancel</button><button class=pri onclick="mclose(1)">${yes}</button></div></div>`;document.body.appendChild(MO)}
function mclose(ok){const f=MF;MF=null;if(MO){MO.remove();MO=null}if(ok&&f)f()}
function submit(auto){if(!auto){const u=S.a.filter(x=>x==null).length;ask(u?`${u} question(s) are unanswered. Submit now?`:'Submit the test?','Submit',doSubmit);return}doSubmit()}
function doSubmit(){mclose(0);if(!S)return;
clearInterval(tm);const t={},d={};let cor=0,wr=0;S.qs.forEach((q,i)=>{const a=S.a[i];for(const[m,k]of[[t,q.topic],[d,q.difficulty]]){m[k]=m[k]||[0,0,0];m[k][2]++;if(a!=null){m[k][0]++;if(isCorrectResponse(q,a))m[k][1]++}}if(a!=null){isCorrectResponse(q,a)?cor++:wr++}});
const r={date:new Date().toISOString().slice(0,16).replace('T',' '),title:S.title,total:S.qs.length,att:cor+wr,cor,wr,score:cor-wr,t,d,mock:!!S.mock};const h=H();h.push(r);sv('qa_h',h.slice(-200));const qs=S.qs,an=S.a;S=null;view='result';document.body.classList.remove('inq');$('#main').innerHTML=result(r,qs,an)+FT;$('#nav').innerHTML=navH();scrollTo(0,0);cu();if(r.total&&r.score>=r.total*.6)boom()}
const pct=(a,b)=>b?Math.round(a/b*100):0,pbar=(l,a,b)=>`<div class=hb><b style="width:170px">${l}</b><div class=bar><i style="width:${pct(a,b)}%"></i></div>${pct(a,b)}% (${a}/${b})</div>`;
function result(r,qs,an){if(r.title.startsWith('Previous year question paper'))setTimeout(()=>document.querySelectorAll('#main .card details').forEach((entry,index)=>{if(an[index]!=null)entry.open=true}),0);const tl=[['Total Questions',r.total],['Attempted',r.att],['Correct',r.cor],['Wrong',r.wr],['Unanswered',r.total-r.att],['Positive Marks','+'+r.cor],['Negative Marks','−'+r.wr],['Final Score',r.score],['Accuracy',pct(r.cor,r.att)+'%'],['Percentage',pct(r.score,r.total)+'%']];
return`<h1>Result — ${r.title}</h1><div class="card rh"><div class=ring style="--p:${Math.max(0,pct(r.score,r.total))}"><span data-n="${pct(r.score,r.total)}%">${pct(r.score,r.total)}%</span></div><div><div class=big data-n="${r.score}">${r.score}</div><span class=mut>Final score out of ${r.total}<br>${r.cor} correct (+${r.cor}), ${r.wr} wrong (−${r.wr}), ${r.total-r.att} unanswered (0)</span></div></div><div class=grid style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${tl.map(([a,b],n)=>`<div class="card tile" style="--i:${n}"><div class=big data-n="${b}">${b}</div><span class=mut>${a}</span></div>`).join('')}</div><h2>Topic-wise performance</h2><div class=card>${Object.entries(r.t).map(([k,v])=>pbar(k,v[1],v[2])).join('')}</div><h2>Difficulty-wise performance</h2><div class=card>${DIFF.filter(k=>r.d[k]).map(k=>pbar(k,r.d[k][1],r.d[k][2])).join('')}</div><h2>Review</h2><div class=card>${qs.map((q,i)=>`<details><summary>${i+1}. ${q.question} — <b style="color:var(--${an[i]==null?'mut':isCorrectResponse(q,an[i])?'ok':'bad'})">${an[i]==null?'Unanswered':isCorrectResponse(q,an[i])?'Correct':'Wrong'}</b></summary>${q.ctx?`<div class=ctx>${q.ctx}</div>`:''}<p>Your answer: <b>${answerText(q,an[i])}</b><br>Correct answer: <b>${correctAnswerText(q)}</b><br>${q.explanation}<br><span class=mut>${q.topic} · ${q.difficulty}</span></p></details>`).join('')}</div><p><button class=pri onclick="go('home')">Back to home</button></p>`}
function progress(){const h=H();if(!h.length)return`<h1>Your Progress</h1><p class=mut>No tests yet. Finish a quiz and your results appear here.</p>`;
const att=h.reduce((x,y)=>x+y.att,0),cor=h.reduce((x,y)=>x+y.cor,0),wr=h.reduce((x,y)=>x+y.wr,0),sc=h.map(x=>x.score),t={};h.forEach(x=>Object.entries(x.t).forEach(([k,v])=>{t[k]=t[k]||[0,0];t[k][0]+=v[0];t[k][1]+=v[1]}));
const tl=Object.entries(t).filter(([,v])=>v[0]).map(([k,v])=>[k,v[1]/v[0],v]).sort((a,b)=>b[1]-a[1]),tiles=[['Total Tests',h.length],['Questions Attempted',att],['Average Score',(sc.reduce((a,b)=>a+b)/sc.length).toFixed(1)],['Best Score',Math.max(...sc)],['Overall Accuracy',pct(cor,att)+'%'],['Strongest Topic',tl.length?tl[0][0]:'—'],['Weakest Topic',tl.length?tl[tl.length-1][0]:'—'],['Correct / Wrong',cor+' / '+wr]];
return`<h1>Your Progress</h1><div class=grid style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">${tiles.map(([a,b],n)=>`<div class="card tile" style="--i:${n}"><div class=big data-n="${b}" style="font-size:${String(b).length>9?15:28}px">${b}</div><span class=mut>${a}</span></div>`).join('')}</div><h2>Topic accuracy</h2><div class=card>${tl.map(([k,,v])=>pbar(k,v[1],v[0])).join('')}</div><h2>Test history</h2><div class=card>${h.slice().reverse().slice(0,30).map(x=>`<div class=row style="padding:4px 0"><b>${x.title}${x.mock?' (mock)':''}</b><span class=mut>${x.date}</span><span class=sp></span>Score ${x.score}/${x.total} · ${pct(x.cor,x.att)}%</div>`).join('')}</div><p><button onclick="ask('Clear all saved progress?','Clear',()=>{sv('qa_h',[]);draw()})">Reset progress</button></p>`}
draw();
</script></body></html>
